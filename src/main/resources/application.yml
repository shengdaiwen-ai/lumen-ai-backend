server:
  port: 9031
  servlet:
    context-path: /api

spring:
  application:
    name: lumen-ai-backend

  # 本地开发默认激活 local profile，真实凭据从 application-local.yml 读取（该文件已 gitignore、不入库）。
  # 生产环境请用环境变量 SPRING_PROFILES_ACTIVE 覆盖。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ========== Spring AI ==========
  ai:
    deepseek:
      # 真实 Key 放在 application-local.yml，或通过环境变量 DEEPSEEK_API_KEY 注入
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-pro
        temperature: 0.7f
        max-tokens: 4096
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 30s
    # MCP Server（Spring AI 2.0 协议枚举：STREAMABLE(默认) / SSE / STATELESS）
    mcp:
      server:
        protocol: streamable
        enabled: true

  # ========== 数据源 ==========
  # 真实连接信息放在 application-local.yml，或通过环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 注入
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lumen_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lumenai.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    multiple-result-sets-enabled: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

lumen:
  ai:
    agent:
      max-loop-rounds: 20
  bocha:
    # 博查搜索 API Key — 从 https://open.bochaai.com 注册获取
    # 格式 sk-xxxxxx，¥0.036/次，DeepSeek 官方同款搜索引擎
    # 未配置时自动降级到百度爬虫
    # 真实 Key 放在 application-local.yml，或通过环境变量 BOCHA_API_KEY 注入
    api-key: ${BOCHA_API_KEY:}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖为随机串（至少 32 字节）
    secret: ${JWT_SECRET:lumen-ai-dev-placeholder-secret-do-not-use-in-production}
    expire-seconds: 7200          # Access Token 2 小时
    refresh-expire-seconds: 604800 # Refresh Token 7 天
    header: Authorization
    prefix: "Bearer "

# ========== OpenClaw Gateway ==========
openclaw:
  gateway-url: http://127.0.0.1:7890

logging:
  level:
    root: INFO
    com.lumenai.backend: DEBUG
    com.baomidou.mybatisplus: INFO
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/lumen-ai.log
  # Spring Boot 4 把这 3 个属性从 logging.file.* 挪到了 logging.logback.rollingpolicy.*
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
